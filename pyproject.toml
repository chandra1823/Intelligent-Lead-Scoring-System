[project]
name = "intelligent-lead-scoring"
version = "2.0.0"
description = "Lead scoring platform with CRM connectors and an MCP server"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.128",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "joblib>=1.4",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "sqlalchemy>=2.0",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "mcp>=1.2",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
lead-mcp = "mcp_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "ml", "connectors", "mcp_server"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
